services:
  backend:
    build: ../Ecommerce-backend
    ports:
      - "5000:5000"
    env_file:
      - ../Ecommerce-backend/.env
    environment:
      PORT: "5000"

  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000"
    depends_on:
      - backend
